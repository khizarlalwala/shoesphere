<!DOCTYPE html>
<html>
<head>
    <title>SoleSphere</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f4f4f4;
        }

        .navbar {
            background: black;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
        }

        .heading {
            text-align: center;
            padding: 30px;
        }

        .brands {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            padding: 20px;
        }

        .brand-card {
            background: white;
            width: 250px;
            margin: 15px;
            text-align: center;
            padding: 20px;
            box-shadow: 0 0 10px #ccc;
            border-radius: 10px;
        }

        .brand-card img {
            width: 200px;
            height: 150px;
            object-fit: contain;
        }

        .btn {
            background: black;
            color: white;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="navbar">SoleSphere 👟</div>

<div class="heading">
    <h1>Select Your Brand</h1>
</div>

<div class="brands">

    <div class="brand-card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a6/Logo_NIKE.svg">
        <h3>Nike</h3>
        <a href="/nike"><button class="btn">View Shoes</button></a>
    </div>

    <div class="brand-card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/20/Adidas_Logo.svg">
        <h3>Adidas</h3>
        <a href="/adidas"><button class="btn">View Shoes</button></a>
    </div>

    <div class="brand-card">
        <img src="https://www.freepnglogos.com/uploads/puma-logo-png-1.png">
        <h3>Puma</h3>
        <a href="/puma"><button class="btn">View Shoes</button></a>
    </div>

    <div class="brand-card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Asics_Logo.svg">
        <h3>Asics</h3>
        <a href="/asics"><button class="btn">View Shoes</button></a>
    </div>

</div>

</body>
</html>
