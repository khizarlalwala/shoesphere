<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>adidas | Exclusive Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Montserrat:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --adi-black: #000000;
            --adi-white: #ffffff;
            --adi-grey: #f6f6f6;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background: var(--adi-white); color: var(--adi-black); }

        /* --- NAVIGATION --- */
        nav {
            position: fixed;
            top: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 8%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .logo { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 1.6rem; text-transform: uppercase; letter-spacing: -1.5px; text-decoration: none; color: var(--adi-black); }

        /* --- HERO SECTION --- */
        .hero {
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .hero-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.shutterstock.com/image-photo/bangkok-thailand-november-20-2022-600nw-2231903277.jpg');
            background-size: cover;
            background-position: center 40%;
            z-index: 1;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.6) 100%);
            z-index: 2;
        }

        .hero-content { position: relative; z-index: 3; }
        .hero h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(3rem, 10vw, 7.5rem);
            font-weight: 900;
            color: var(--adi-white);
            text-transform: uppercase;
            font-style: italic;
            line-height: 0.85;
            letter-spacing: -3px;
            margin-bottom: 25px;
        }

        .btn-shop {
            display: inline-block;
            padding: 20px 60px;
            background: var(--adi-white);
            color: var(--adi-black);
            text-decoration: none;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: var(--transition);
        }
        .btn-shop:hover { transform: translateY(-5px); background: var(--adi-black); color: var(--adi-white); }

        /* --- PRODUCT GRID (3 SHOES) --- */
        .section { padding: 100px 8%; text-align: center; }
        .section-title { 
            font-family: 'Montserrat', sans-serif; 
            font-size: 2.2rem; 
            text-transform: uppercase; 
            font-style: italic; 
            margin-bottom: 50px; 
            text-align: left;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--adi-grey);
            padding: 30px;
            text-align: left;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .card:hover {
            background: var(--adi-white);
            border-color: var(--adi-black);
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        }

        .card img {
            width: 100%;
            height: 300px;
            object-fit: contain; /* Keeps shoe shape perfect */
            margin-bottom: 25px;
            mix-blend-mode: multiply;
        }

        .card h3 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .card .price {
            font-weight: 400;
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 20px;
            display: block;
        }

        .btn-buy {
            display: block;
            width: 100%;
            padding: 15px;
            background: var(--adi-black);
            color: var(--adi-white);
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-buy:hover { background: #333; }

        footer { background: #000; color: #fff; padding: 40px; text-align: center; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; }

        @media (max-width: 768px) {
            .hero h1 { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">adidas</a>
    </nav>

    <section class="hero">
        <div class="hero-bg"></div>
        <div class="hero-content">
            <h1>Step Into <br>The Future</h1>
            <a href="#shop" class="btn-shop">Shop Now</a>
        </div>
    </section>

    <section class="section" id="shop">
        <h2 class="section-title">New Arrivals</h2>
        <div class="grid">
            <div class="card">
                <img src="https://i1.t4s.cz//products/hq6355/adidas-ultraboost-light-w-563484-hq6357-960.webp" alt="Ultraboost">
                <h3>Ultraboost Light</h3>
                <span class="price">₹18,999.00</span>
                <a href="#" class="btn-buy">Buy Now</a>
            </div>

            <div class="card">
                <img src="https://media.sivasdescalzo.com/media/catalog/product/J/I/JI3217_sivasdescalzo-adidas-SAMBA_OG-1736947657-1.jpg?width=1920&q=72&optimize=high&format=auto" alt="Samba">
                <h3>Samba OG Shoes</h3>
                <span class="price">₹17,999.00</span>
                <a href="#" class="btn-buy">Buy Now</a>
            </div>

            <div class="card">
                <img src="https://hips.hearstapps.com/vader-prod.s3.amazonaws.com/1754493197-adidas-evo-sl-1000px-689370acd9b80.jpg?crop=1xw:1xh;center,top&resize=980:*" alt="Adizero">
                <h3>Adizero</h3>
                <span class="price">₹22,999.00</span>
                <a href="#" class="btn-buy">Buy Now</a>
            </div>
        </div>
    </section>

    <footer>
        &copy; 2026 ADIDAS INDIA MARKETING PVT. LTD.
    </footer>

</body>
</html>
